<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 프로필 카드</title>
  <style>
    /* 기본 초기화 및 폰트 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 화면 정중앙 배치를 위한 Flexbox 설정 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      /* 4. 배경: 보라색 그라데이션 */
      background: linear-gradient(135deg, #6b46c1 0%, #9f7aea 50%, #553c9a 100%);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #1f2937;
    }

    /* 1. 화면 정중앙에 놓인 흰색 둥근 카드 */
    .profile-card {
      width: 100%;
      max-width: 380px;
      background-color: #ffffff;
      border-radius: 28px;
      padding: 44px 32px 38px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(34, 15, 75, 0.28);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 56px rgba(34, 15, 75, 0.34);
    }

    /* 3. 카드 상단 큰 원형 이미지 플레이스홀더 (회색 동그라미) */
    .avatar-placeholder {
      width: 124px;
      height: 124px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background-color: #e5e7eb;
      border: 4px solid #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    /* 플레이스홀더 내부의 은은한 기본 실루엣 (순수 CSS 도형) */
    .avatar-silhouette {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .avatar-silhouette::before {
      content: "";
      width: 38px;
      height: 38px;
      background-color: #cbd5e1;
      border-radius: 50%;
      margin-bottom: 8px;
    }

    .avatar-silhouette::after {
      content: "";
      width: 76px;
      height: 36px;
      background-color: #cbd5e1;
      border-radius: 40px 40px 0 0;
    }

    /* 2 & 5. 이름 및 마우스 호버 시 색상 변경 효과 */
    .profile-name {
      display: inline-block;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #111827;
      margin-bottom: 10px;
      cursor: pointer;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .profile-name:hover {
      color: #7c3aed;
      transform: scale(1.03);
    }

    /* 2. 한 줄 소개 */
    .profile-bio {
      font-size: 0.975rem;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    /* 구분선 */
    .divider {
      height: 1px;
      background-color: #f3f4f6;
      margin-bottom: 24px;
    }

    /* 2. 좋아하는 것 3가지 섹션 */
    .favorites-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    .favorites-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .favorite-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      background-color: #f9fafb;
      border: 1px solid #f3f4f6;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #374151;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .favorite-item:hover {
      background-color: #f5f3ff;
      border-color: #ddd6fe;
    }

    .favorite-emoji {
      font-size: 1.2rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <!-- 상단 원형 이미지 플레이스홀더 -->
    <div class="avatar-placeholder" role="img" aria-label="프로필 이미지 플레이스홀더">
      <div class="avatar-silhouette"></div>
    </div>

    <!-- 이름 (마우스 호버 시 색상 변경) -->
    <h1 class="profile-name">김수현</h1>

    <!-- 한 줄 소개 -->
    <p class="profile-bio">일상의 작은 즐거움과 성장을 기록하는 사람입니다.</p>

    <div class="divider"></div>

    <!-- 좋아하는 것 3가지 -->
    <section aria-label="좋아하는 것">
      <h2 class="favorites-title">좋아하는 것</h2>
      <ul class="favorites-list">
        <li class="favorite-item">
          <span class="favorite-emoji" aria-hidden="true">🎹</span>
          <span>피아노</span>
        </li>
        <li class="favorite-item">
          <span class="favorite-emoji" aria-hidden="true">💪</span>
          <span>운동</span>
        </li>
        <li class="favorite-item">
          <span class="favorite-emoji" aria-hidden="true">🍽️</span>
          <span>맛있는 음식</span>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
